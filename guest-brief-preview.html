<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Cabin Brief — preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      /* Screenshots run with the tab backgrounded, which freezes rAF and leaves
         framer mid-entrance. Pin everything to its settled state. */
      #preview-root div { opacity: 1 !important; transform: none !important; }
      #preview-root div[style*="100deg"] { display: none !important; }
      html, body { overflow: auto !important; height: auto !important; }
    </style>
  </head>
  <body>
    <div id="preview-root"></div>
    <script type="module" src="/src/preview-guest-brief.jsx"></script>
  </body>
</html>
